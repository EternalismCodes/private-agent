name: Build release APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # pubspec.yaml needs Dart ^3.10.3, i.e. Flutter 3.38 or newer.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      # Flutter normally adds android/gradlew itself when it is missing; this is
      # a fallback so a clean checkout never fails on the wrapper.
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "android/gradlew missing - Flutter will generate it during the build"
          fi

      - name: Prepare release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          PROPS
            echo "Using release keystore from secrets."
          else
            echo "No keystore secrets set - the APK will be signed with the debug key."
          fi

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: private-agent-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
